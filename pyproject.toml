[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "filamentor"
version = "0.1.0"
description = "Analisa modelos STL/3MF e gera configurações do Bambu Studio para Bambu Lab A1 / A1 mini."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "numpy>=2.0",
    "scipy>=1.13",
    "trimesh>=4.4",
    "networkx>=3.3",  # leitura de 3MF pelo trimesh
    "lxml>=5.2",  # leitura de 3MF pelo trimesh
    "embreex>=2.17",  # ray casting rápido (espessura de parede em malhas de milhões de faces)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "manifold3d>=2.5",  # uniões booleanas para montar malhas de teste
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
src = ["backend"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
